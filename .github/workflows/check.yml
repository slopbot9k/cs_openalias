name: OpenAlias integration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: '3.10.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: cs_openalias
      # The core packages remain unpublished; test exact reviewed revisions.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cypherstack/openalias
          ref: ae31390f433952d424c1d71db731bf482a572ee7
          path: openalias
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cypherstack/dnssec_resolver
          ref: 05a103b73e6460492fc94203ab6b617cac1fbf11
          path: dnssec_resolver
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cypherstack/doh_transport
          ref: 05f499e24754771ba02328bc23ab9c93ee4f8641
          path: doh_transport
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}
      - shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - shell: bash
        working-directory: cs_openalias
        run: |
          overrides() {
            echo 'dependency_overrides:'
            for package in openalias dnssec_resolver doh_transport; do
              printf '  %s:\n    path: %s/%s\n' "$package" "$1" "$package"
            done
          }
          overrides .. > pubspec_overrides.yaml
          overrides ../.. > example/pubspec_overrides.yaml
      - run: dart tool/check.dart
        working-directory: cs_openalias
